<div id="ProductForm">
      @if (isEditing){
        <h1>Phiếu chỉnh sửa</h1>
      }
      @if (isMakingNew){
        <h1>Phiếu tạo mới</h1>
      }
        <section>
          <h2>Tên tuổi</h2>
          <span>Tên sản phẩm</span> <input type="text" [formField]="ProductForm.ten_sp"/> <br>
          <span>Danh mục</span>  <input type="text" [formField]="ProductForm.danh_muc"/>
        </section>
        <section>
          <h2>Tiền</h2>
          <span>Đơn vị tính</span>
          <select [formField]="ProductForm.don_vi_tinh">
            <option value="VietNamDong">VNĐ</option>
            <option value="Dollar">Đô la</option>
            <option value="JPY">Yên Nhật</option>
            <option value="Euro">Đồng Euro</option>
          </select> <br>
          <span>Giá nhập</span> <input type="number" [formField]="ProductForm.gia_nhap" /> <br>
          <span>Giá bán</span> <input type="number" [formField]="ProductForm.gia_ban" />
        </section>
        <section>  
          <h2>Số lượng tồn</h2>
          <span>Số lượng tồn</span> <input type="number" [formField]="ProductForm.so_luong_ton" /> <br>
          <span>Mức tồn tối thiểu</span> <input type="number" [formField]="ProductForm.muc_ton_toi_thieu" />
        </section>
        <button>Chỉnh sửa</button>
        <button (click)="AddProduct()">Tạo mới</button>
</div>
